<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" role="img" aria-labelledby="ev-title ev-desc"><title id="ev-title">Evidence classes in the Quantum Claims Evidence Passport</title><desc id="ev-desc">Five separate evidence classes are shown side by side. They are not a shared score or a single ranking.</desc><rect width="1240" height="300" rx="24" fill="#f5f7fb"/><text x="32" y="39" fill="#12233f" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Evidence classes are different kinds of records, not one score</text><g transform="translate(24,64)"><rect width="224" height="204" rx="16" fill="#dcecff" stroke="#245a9b" stroke-width="1.5"/><rect width="8" height="204" rx="4" fill="#245a9b"/><text x="22" y="38" fill="#245a9b" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ANNOUNCEMENT / PLAN</text><text x="22" y="83" fill="#12233f" font-family="system-ui, sans-serif" font-size="15" font-weight="650">What an organization says</text><text x="22" y="116" fill="#35435a" font-family="system-ui, sans-serif" font-size="13">Status and expected dates</text></g><g transform="translate(268,64)"><rect width="224" height="204" rx="16" fill="#e5e5ff" stroke="#51459a" stroke-width="1.5"/><rect width="8" height="204" rx="4" fill="#51459a"/><text x="22" y="38" fill="#51459a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">COMPUTATIONAL MODEL</text><text x="22" y="83" fill="#12233f" font-family="system-ui, sans-serif" font-size="15" font-weight="650">What a model predicts</text><text x="22" y="116" fill="#35435a" font-family="system-ui, sans-serif" font-size="13">Not a biological measurement</text></g><g transform="translate(512,64)"><rect width="224" height="204" rx="16" fill="#dff4ef" stroke="#176b5c" stroke-width="1.5"/><rect width="8" height="204" rx="4" fill="#176b5c"/><text x="22" y="38" fill="#176b5c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ANIMAL BEHAVIOR</text><text x="22" y="83" fill="#12233f" font-family="system-ui, sans-serif" font-size="15" font-weight="650">What rats did in a test</text><text x="22" y="116" fill="#35435a" font-family="system-ui, sans-serif" font-size="13">Not a 613 THz readout</text></g><g transform="translate(756,64)"><rect width="224" height="204" rx="16" fill="#fff0d7" stroke="#946315" stroke-width="1.5"/><rect width="8" height="204" rx="4" fill="#946315"/><text x="22" y="38" fill="#946315" font-family="system-ui, sans-serif" font-size="13" font-weight="800">HYPOTHESIS</text><text x="22" y="83" fill="#12233f" font-family="system-ui, sans-serif" font-size="15" font-weight="650">A proposed explanation</text><text x="22" y="116" fill="#35435a" font-family="system-ui, sans-serif" font-size="13">Not a settled mechanism</text></g><g transform="translate(1000,64)"><rect width="224" height="204" rx="16" fill="#fde3e5" stroke="#a53845" stroke-width="1.5"/><rect width="8" height="204" rx="4" fill="#a53845"/><text x="22" y="38" fill="#a53845" font-family="system-ui, sans-serif" font-size="13" font-weight="800">UNSUPPORTED INFERENCE</text><text x="22" y="83" fill="#12233f" font-family="system-ui, sans-serif" font-size="15" font-weight="650">Claim exceeds its source</text><text x="22" y="116" fill="#35435a" font-family="system-ui, sans-serif" font-size="13">Do not promote to fact</text></g></svg>
